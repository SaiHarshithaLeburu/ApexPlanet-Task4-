<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Product Store | Task 4</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            Harshitha<span>.</span>
        </div>


        <div class="nav-links">

            <a href="index.html">
                Portfolio
            </a>

            <a href="todo.html">
                To-Do
            </a>

            <a href="products.html">
                Products
            </a>

        </div>

    </nav>


    <!-- HEADER -->

    <section class="app-header">

        <p class="small-heading">
            PRODUCT EXPLORER
        </p>

        <h1>
            Explore Products 🛍️
        </h1>

        <p>
            Filter products by category and sort them by price or rating.
        </p>

    </section>


    <!-- FILTERS -->

    <section class="filter-section">

        <div class="filter-box">

            <label for="categoryFilter">
                Category
            </label>

            <select id="categoryFilter">

                <option value="all">
                    All Categories
                </option>

                <option value="electronics">
                    Electronics
                </option>

                <option value="fashion">
                    Fashion
                </option>

                <option value="books">
                    Books
                </option>

                <option value="accessories">
                    Accessories
                </option>

            </select>

        </div>


        <div class="filter-box">

            <label for="priceFilter">
                Maximum Price
            </label>

            <select id="priceFilter">

                <option value="all">
                    Any Price
                </option>

                <option value="500">
                    Under ₹500
                </option>

                <option value="1000">
                    Under ₹1000
                </option>

                <option value="2000">
                    Under ₹2000
                </option>

                <option value="5000">
                    Under ₹5000
                </option>

            </select>

        </div>


        <div class="filter-box">

            <label for="sortFilter">
                Sort By
            </label>

            <select id="sortFilter">

                <option value="default">
                    Default
                </option>

                <option value="low">
                    Price: Low to High
                </option>

                <option value="high">
                    Price: High to Low
                </option>

                <option value="rating">
                    Rating
                </option>

            </select>

        </div>

    </section>


    <!-- PRODUCTS -->

    <main>

        <div id="productGrid"
             class="product-grid">

        </div>


        <p id="noProducts"
           class="no-products">

            No products found.

        </p>

    </main>


    <footer>

        <p>
            ApexPlanet Internship — Task 4
        </p>

    </footer>


    <script src="products.js"></script>

</body>

</html>
